<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — OSINT Hub</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --paper: #efeee8; --ink: #0d0d0d; --accent: #ff3b00; --muted: #7b7a72; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0f100e; --ink: #ebe9e1; --muted: #85847c; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--paper); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    main { max-width: 640px; width: 100%; border-top: 2px solid var(--ink); padding-top: 18px; }
    .meta { font-family: Consolas, monospace; font-size: .75rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: clamp(5rem, 22vw, 10rem); line-height: .85; margin: 24px 0 8px; font-weight: 900; letter-spacing: -.03em; }
    h1 span { color: var(--accent); }
    p { font-size: 1.15rem; line-height: 1.5; }
    code { font-family: Consolas, monospace; background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 2px 6px; word-break: break-all; }
    a.btn { display: inline-block; margin-top: 12px; padding: 14px 22px; background: var(--ink); color: var(--paper); text-decoration: none;
      font-family: Consolas, monospace; font-weight: 800; text-transform: uppercase; font-size: .85rem; }
    a.btn:hover { box-shadow: 4px 4px 0 var(--accent); transform: translate(-2px, -2px); }
  </style>
</head>
<body>
  <main>
    <div class="meta"><span>OSINT/HUB</span><span>ERREUR 404 · COORDONNÉES INCONNUES</span></div>
    <h1>4<span>0</span>4</h1>
    <p>Cette page n'existe pas, ou plus. Même avec les meilleurs indices, impossible de la géolocaliser.</p>
    <p>Adresse demandée : <code id="path"></code></p>
    <a class="btn" id="home" href="./">Retour au hub →</a>
  </main>
  <script>
    document.getElementById("path").textContent = location.pathname;
    // Sur GitHub Pages, le site est dans /<nom-du-depot>/ : le lien de retour pointe vers ce dossier
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
